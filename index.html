<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cdeeff">
<title>추억은방울방울</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방울방울">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#dff3ff;--panel:#ffffffe6;--line:#bfe0f5;--txt:#2b3a55;--sub:#7188a8;--acc:#ff6fa8;--acc2:#6cc3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#c6ebff 0%,#e8f7ff 48%,#ffe8f3 100%) fixed;color:var(--txt);font-family:"Jua",-apple-system,"Noto Sans KR",system-ui,sans-serif}
button{font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:0 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
button:active{transform:translateY(3px) scale(.95);box-shadow:none}
select{font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 10px}
button.pri{background:linear-gradient(135deg,#ff9cc9,#ff6fa8);border-color:#ff6fa8;color:#fff;box-shadow:0 3px 0 #e0558e}
button.pri:active{box-shadow:none}
button:disabled{opacity:.4}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);pointer-events:none}
#app>*{pointer-events:auto}
/* 영상은 화면 전체에 크게 깔고, 헤더와 아래 패널(클립 목록 등)이 그 위에 반투명으로 얹힘 */
#dock{margin-top:auto;display:flex;flex-direction:column;max-height:52dvh;background:rgba(255,255,255,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(40,70,120,.25)}
body.mini #trBar,body.mini #list,body.mini #actions,body.busy #trBar,body.busy #list,body.busy #actions{display:none} /* 재생 중이거나 접었을 때는 재생 막대만 남겨 영상을 가리지 않음 */
#btnMini{width:44px;padding:8px 0;flex:none}
#diag{position:fixed;inset:0;z-index:60;background:rgba(40,60,110,.9);display:flex;align-items:center;justify-content:center;padding:16px}
#diag .box{background:#fff;color:var(--txt);border-radius:22px;padding:16px;max-width:520px;width:100%;max-height:82dvh;overflow:auto}
#diag pre{white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;margin:8px 0}
/* 재생·내보내기 중: 배경 애니메이션과 흐림 효과를 꺼서 영상 재생·그리기가 끊기지 않게 함 */
body.busy #bubbles{display:none}
body.busy *{animation:none!important}
body.busy #actions,body.busy #exp{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bubbles i{position:absolute;bottom:-120px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0 12%,rgba(255,255,255,.35) 13% 40%,rgba(130,200,255,.18) 70%);border:1.5px solid rgba(255,255,255,.8);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0) scale(.8);opacity:0}10%{opacity:1}50%{transform:translate(18px,-55dvh) scale(1)}100%{transform:translate(-14px,-115dvh) scale(1.1);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(6deg)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:0 0 22px 22px}
header h1{font-size:22px;margin:0;font-weight:400;background:linear-gradient(90deg,#ff6fa8,#6cc3ff);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
header h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
#stage{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px 6px}
#snd{flex:none;width:44px;height:44px;padding:0;font-size:22px;border-radius:50%}
#snd.on{background:var(--acc);color:#fff}
#cv{position:fixed;z-index:0;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh * 9 / 16));aspect-ratio:9/16;background:#000;touch-action:none}
body{background:#000!important}
/* 수정 화면이 열려 있으면 영상을 위쪽 빈 공간에 맞춰 줄여서 아래 글자도 가려지지 않게 함 */
body.editing #cv{width:min(100vw,calc((48dvh - 64px) * 9 / 16));top:calc(64px + (48dvh - 64px) / 2)}
#playbar{display:flex;align-items:center;gap:8px;width:100%;max-width:460px}
#btnPlay{width:44px;padding:8px 0}
#prog{flex:1;height:10px;background:#fff;border:2px solid var(--line);border-radius:999px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:999px}
#time{font-size:12px;color:var(--sub);min-width:72px;text-align:right}
#trBar{flex:none;display:flex;align-items:center;gap:8px;padding:2px 16px 0;color:var(--sub);font-size:14px}
#trBar span{white-space:nowrap}
#trBar .chips{flex:1;padding:4px 0}
#trBar select{flex:none;font-size:14px;padding:5px 8px}
#trBar .chips button{font-size:14px;padding:5px 12px}
#list{flex:1;min-height:0;overflow:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--sub);text-align:center;margin-top:24px;line-height:1.8;font-size:16px}
.empty .big{display:block;font-size:44px;animation:bob 2.4s ease-in-out infinite}
.card{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid #fff;border-radius:22px;padding:8px;box-shadow:0 4px 14px rgba(90,150,210,.18)}
.card.new{animation:pop .35s ease-out both} /* 새로 추가한 클립에만 나타나는 효과 (목록을 다시 그릴 때마다 보이면 깜빡임) */
.card.sel{border-color:var(--acc)}
.card img,.card .noimg{width:45px;height:80px;object-fit:cover;border-radius:14px;background:#cfe;flex:none}
.meta{flex:1;min-width:0;font-size:15px}
.meta b{display:block}
.meta span{color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{cursor:pointer;position:relative;transition:transform .15s}
.btns{display:grid;grid-template-columns:repeat(2,36px);gap:4px}
.btns button{padding:5px 0;font-size:14px;box-shadow:0 2px 0 var(--line)}
.grip{flex:none;width:34px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--sub);touch-action:none;cursor:grab;border-radius:14px;user-select:none;-webkit-user-select:none}
.card.dragging{transition:none;z-index:5;box-shadow:0 10px 26px rgba(60,110,180,.4);opacity:.95}
#undo{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#334;color:#fff;border-radius:22px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:15px}
#undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#undo button{padding:5px 12px}
#shDel{margin-right:6px}
#actions{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:26px 26px 0 0}
#actions button,#actions label{flex:1;text-align:center;font-size:15px;padding:12px 4px;border-radius:999px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
#actions .rec{background:linear-gradient(135deg,#ff9cc9,#ff6fa8);border-color:#ff6fa8;color:#fff;box-shadow:0 3px 0 #e0558e;animation:pulse 2s ease-in-out infinite}
/* camera */
#cam{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;color:#fff}
#camVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camTop,#camBot{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
#camBot{margin-top:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));justify-content:center;gap:28px}
.chip{border-radius:999px;padding:7px 14px;background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.4);box-shadow:none;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc)}
#recBtn{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--acc);padding:0;position:relative}
#recBtn.rec{border-radius:24px;background:#fff;border-color:var(--acc)}
#recBtn{box-shadow:0 0 0 6px rgba(255,255,255,.25)}
#cdown{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:72px;font-weight:800;text-shadow:0 2px 12px #000;z-index:2;pointer-events:none}
#camCount{min-width:60px;text-align:center;font-size:13px;background:rgba(0,0,0,.5);border-radius:10px;padding:8px}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:52dvh;overflow:auto;background:#fffffff2;border-top:3px solid #fff;border-radius:28px 28px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -8px 30px rgba(90,150,210,.35)}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.lbl{font-size:12px;color:var(--sub);margin-top:8px}
textarea{width:100%;background:#f3faff;color:var(--txt);border:2px solid var(--line);border-radius:18px;padding:10px 12px;font:inherit;font-size:17px;resize:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chips button{flex:none;font-size:18px;padding:7px 12px}
.chips button.on{border-color:var(--acc);background:#ffe3f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:6px}
.grid label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:44px;height:32px;padding:0;border:2px solid var(--line);background:none;border-radius:999px;vertical-align:middle}
.row label{font-size:13px;color:var(--sub)}
/* export */
#exp{position:fixed;inset:0;color:#fff;background:rgba(40,60,110,.86);backdrop-filter:blur(6px);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#expBar{width:min(320px,80vw);height:12px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
#expBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:999px}
#expRes video{height:50dvh;border-radius:22px;background:#000;border:4px solid #fff}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3a55ee;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
[hidden]{display:none!important}
#vid,#vid2{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
</style>
</head>
<body>
<div id="bubbles"></div>
<canvas id="cv" width="720" height="1280"></canvas>
<div id="app">
  <header><h1><span>🫧</span>추억은방울방울</h1><div style="display:flex;gap:6px"><select id="qSel" title="내보내기 화질"><option value="1">720p</option><option value="1.5">1080p</option></select><button class="pri" id="btnExport">내보내기</button></div></header>
  <div id="dock">
  <div id="stage">
    <div id="playbar"><button id="btnPlay">▶</button><div id="prog"><i></i></div><span id="time">0:00 / 0:00</span><button id="snd" aria-pressed="false" title="소리 켜기/끄기">🔇</button><button id="btnMini" title="목록 접기/펼치기">⌄</button></div>
  </div>
  <div id="trBar"><span>✨ 전환</span><div class="chips" id="trChips"></div><select id="trSpeed" title="전환 속도"><option value="0.2">빠르게</option><option value="0.4">보통</option><option value="0.7">느리게</option></select></div>
  <div id="list"></div>
  <div id="actions">
    <button class="rec" id="btnRec">● 촬영</button>
    <label>📁 가져오기<input type="file" id="fImport" accept="video/*,image/*" multiple hidden></label>
    <label>📷 기본 카메라<input type="file" id="fNative" accept="video/*" capture="environment" hidden></label>
  </div>
  </div>
</div>

<div id="cam" hidden>
  <video id="camVid" playsinline muted autoplay></video>
  <div id="camTop">
    <button id="camClose" class="chip">✕ 닫기</button>
    <div style="display:flex;gap:6px" id="lenChips"></div>
    <button id="camFlip" class="chip">🔄</button>
  </div>
  <div id="cdown"></div>
  <div id="camBot"><div id="camCount">0개</div><button id="recBtn"></button><div style="min-width:60px"></div></div>
</div>

<div id="sheet" hidden>
  <div class="sh-head"><b id="shTitle"></b><span><button id="shDel" title="이 클립 삭제">🗑 삭제</button><button class="pri" id="shClose">완료</button></span></div>
  <div class="row" id="imgRow" hidden><label style="display:block;width:100%">🖼 사진 보여주는 시간 <b id="imgDurVal"></b><input type="range" id="fImgDur" min="1" max="10" step="0.5"></label></div>
  <div class="row" id="tabs"></div>
  <div class="lbl">💡 위쪽 영상 화면에서 글자를 손가락으로 끌어 옮길 수 있어요</div>
  <textarea id="fText" rows="2" placeholder="자막 내용 (줄바꿈 가능)"></textarea>
  <div class="row"><label style="display:block;width:100%">⏱ 표시 범위 (이 클립부터) <select id="fSpan" style="width:100%;margin-top:4px"></select></label></div>
  <div class="lbl">글꼴</div><div class="chips" id="fontChips"></div>
  <div class="lbl">효과</div><div class="chips" id="fxChips"></div>
  <div class="grid">
    <label>크기<input type="range" id="fSize" min="30" max="170"></label>
    <label>위치(위↔아래)<input type="range" id="fY" min="5" max="95"></label>
    <label>나타나는 시점(초)<input type="range" id="fDelay" min="0" max="4" step="0.1"></label>
    <label>외곽선 굵기<input type="range" id="fSw" min="0" max="24"></label>
  </div>
  <div class="row">
    <label>글자색 <input type="color" id="fColor"></label>
    <label>외곽선색 <input type="color" id="fStroke"></label>
    <label><input type="checkbox" id="fBox"> 배경 박스</label>
  </div>
  <div class="lbl">모든 클립에 한꺼번에</div>
  <div class="row"><button id="fAll">📋 이 텍스트(글자+스타일)를 모든 클립에 적용</button></div>
  <div class="row"><button id="fPlay">▶ 효과 미리보기</button><button id="fDel">이 텍스트 삭제</button></div>
</div>

<div id="exp" hidden>
  <div id="expMsg" style="font-size:15px;line-height:1.6"></div>
  <div id="expBar"><i></i></div>
  <div id="expRes" hidden></div>
  <div class="row" id="expBtns" style="justify-content:center"></div>
</div>

<div id="diag" hidden><div class="box"><b>재생 진단</b><pre id="diagTxt"></pre><div class="row"><button id="diagCopy">복사</button><button id="diagClose" class="pri">닫기</button></div></div></div>

<div id="undo"><span>클립을 삭제했어요</span><button id="undoBtn" class="pri">되돌리기</button></div>
<div id="toast"></div>
<video id="vid" playsinline muted></video>
<video id="vid2" playsinline muted></video>

<script>
'use strict';
const $=s=>document.querySelector(s);
const W=720,H=1280;
const cv=$('#cv'),ctx=cv.getContext('2d',{alpha:false}); // 투명도가 필요 없으므로 끄면 그리기가 빨라짐
// 영상 요소 2개를 번갈아 사용: 재생 중인 vid, 다음 클립을 미리 불러두는 spare
const vids=[$('#vid'),$('#vid2')];
let vid=vids[0],spare=vids[1],spareIdx=-1;
/* 일부 휴대폰(특히 iOS)은 사용자가 직접 시작하지 않은 두 번째 영상 요소의 자동 재생을 막음.
   그런 기기에서는 영상 요소 하나만 쓰는 모드로 자동 전환하고(다음 실행부터 기억), 끊김보다 안정성을 우선 */
let useSingle=false;
try{useSingle=localStorage.getItem('single3')==='1'}catch(e){} // 판정 방식을 바꿨으므로 이전 판정(single, single2)은 버림
const diagInfo={single:''}; // 안전 모드로 바뀐 이유 (진단 화면에 표시)
function enterSingle(why,persist=false){ // 재생 중 감지한 경우는 이번 실행에서만 적용 (잘못된 판정이 계속 남지 않게). 거부가 확실할 때만 기억
  useSingle=true;diagInfo.single=why;
  if(persist){try{localStorage.setItem('single3','1')}catch(e){}}
  vid=vids[0];spare=vids[1];spareIdx=-1;prerolledIdx=-1;
  stopAllAudio();
  try{spare.pause()}catch(e){}
  console.warn('단일 영상 모드:',why);
}
const img=new Image(); // 사진 클립용
const PREVIEW_S=0.75; // 미리보기는 화면에 보이는 크기에 맞춰 540x960으로 그림 (내보내기는 고른 화질 720p/1080p 그대로)
let S=PREVIEW_S; // 해상도 배율 (논리 좌표는 항상 720x1280)
function setRes(s){S=s;cv.width=Math.round(W*s);cv.height=Math.round(H*s)}
setRes(PREVIEW_S);
try{const q=localStorage.getItem('q');if(q)$('#qSel').value=q}catch(e){}
$('#qSel').onchange=e=>{try{localStorage.setItem('q',e.target.value)}catch(_){}};

/* ---------- 글꼴 / 효과 ---------- */
const FONTS=[
  {n:'Jua',q:'Jua'},{n:'Black Han Sans',q:'Black+Han+Sans'},{n:'Do Hyeon',q:'Do+Hyeon'},
  {n:'Noto Sans KR',q:'Noto+Sans+KR:wght@900',w:900},{n:'Gaegu',q:'Gaegu:wght@700',w:700},
  {n:'Nanum Pen Script',q:'Nanum+Pen+Script'},{n:'Gugi',q:'Gugi'},{n:'Dokdo',q:'Dokdo'},
  {n:'East Sea Dokdo',q:'East+Sea+Dokdo'},{n:'Song Myung',q:'Song+Myung'},{n:'Yeon Sung',q:'Yeon+Sung'},
  {n:'Hi Melody',q:'Hi+Melody'},{n:'Cute Font',q:'Cute+Font'},{n:'Poor Story',q:'Poor+Story'},
  {n:'Gowun Batang',q:'Gowun+Batang:wght@700',w:700},{n:'Single Day',q:'Single+Day'},
  {n:'Stylish',q:'Stylish'},{n:'Bagel Fat One',q:'Bagel+Fat+One'},{n:'Pacifico',q:'Pacifico'},{n:'Bebas Neue',q:'Bebas+Neue'}
];
const EFFECTS=[['none','없음'],['fade','페이드'],['pop','팝'],['slide','슬라이드 업'],['type','타자기'],['bounce','바운스'],['pulse','두근두근']];
FONTS.forEach(f=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f.q+'&display=swap';document.head.appendChild(l)});
const fontOf=n=>FONTS.find(f=>f.n===n)||FONTS[0];
const fontStr=l=>`${fontOf(l.font).w||400} ${l.size}px "${l.font}", sans-serif`;

let clips=[],cur=-1,playing=false,runToken=0,exporting=false;

function initAudio(){
  if(!actx){
    try{
      actx=new(window.AudioContext||window.webkitAudioContext)();
      dest=actx.createMediaStreamDestination();
      prevGain=actx.createGain();prevGain.connect(actx.destination);applyVol();
      // 두 영상 요소 모두 같은 오디오 경로로 연결 (내보내기에 소리가 들어가도록)
      vids.forEach(v=>{const s=actx.createMediaElementSource(v);s.connect(dest);s.connect(prevGain)});
    }catch(e){actx=null}
  }
  if(actx&&actx.state==='suspended')actx.resume();
  unlockFb(); // 아이폰: 보조 오디오를 버튼을 누른 이 순간에 한 번 재생해 허가를 받아 둠
  // (영상은 항상 음소거로 재생하므로 영상의 재생 허가를 미리 받아 둘 필요는 없음. 예전에 이 확인을 기다리다 시간이 초과되어
  //  쓸 수 있는 두 번째 영상 요소를 안 되는 것으로 잘못 판정하던 문제가 있어서 없앰. 안 될 때는 재생 중에 직접 감지해서 바꿈)
}
/* 영상은 항상 음소거로 재생하고, 소리는 미리 해독해 둔 오디오(AudioBuffer)를 따로 재생함.
   휴대폰(특히 iOS)은 "소리 나는 영상"을 한 번에 하나만, 그것도 사용자가 버튼을 누른 직후에만 재생하게 막지만
   음소거 영상은 여러 개를 아무 때나 재생할 수 있음 → 다음 클립을 미리 재생해 두는 방식이 모든 기기에서 가능해짐 */
const abuf=new Map();      // clip.id -> AudioBuffer(해독 성공) | 'pending' | null(해독 불가 → 영상 요소의 소리로 대체)
const liveAudio=new Map(); // 클립 번호 -> 재생 중인 오디오
const MAX_DECODE=40e6;     // 이보다 큰 파일은 해독하지 않고 영상 요소의 소리를 사용 (메모리 보호)
const hasBuf=clip=>abuf.get(clip.id) instanceof AudioBuffer;
/* 소리 해독 전용 오프라인 오디오: 사용자가 버튼을 누르기 전에도 쓸 수 있어서, 클립을 추가하거나 앱을 열 때 미리 해독해 둘 수 있음
   (재생 버튼을 누른 뒤에 해독하면 시작이 늦어짐. 해독한 결과는 재생용 오디오에서 그대로 사용 가능) */
let decoder=null;
function getDecoder(){
  if(decoder)return decoder;
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  try{decoder=OC?new OC(2,1,44100):null}catch(e){decoder=null}
  return decoder;
}
/* 앱 안에서 녹화한 영상의 소리: 아이폰은 녹화된 영상 파일(조각난 MP4)에서 소리를 해독하지 못하므로, 녹화하는 동안 마이크 소리를 직접 받아 저장 */
let pcmCap=null;
function startPcm(){
  try{
    if(!actx||!camStream||!camStream.getAudioTracks().length)return;
    const src=actx.createMediaStreamSource(camStream),sp=actx.createScriptProcessor(4096,1,1),mute=actx.createGain();
    mute.gain.value=0; // 스피커로 다시 나가지 않게 (일부 브라우저는 출력에 연결해야 동작)
    const chunks=[];
    sp.onaudioprocess=e=>{chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
    src.connect(sp);sp.connect(mute);mute.connect(actx.destination);
    pcmCap={src,sp,mute,chunks,rate:actx.sampleRate};
  }catch(e){pcmCap=null}
}
function stopPcm(){
  const c=pcmCap;pcmCap=null;if(!c)return null;
  try{c.sp.onaudioprocess=null;c.src.disconnect();c.sp.disconnect();c.mute.disconnect()}catch(e){}
  let n=0;c.chunks.forEach(a=>n+=a.length);if(n<1000)return null;
  const data=new Float32Array(n);let o=0;c.chunks.forEach(a=>{data.set(a,o);o+=a.length});
  return {rate:c.rate,data};
}
function bufFromPcm(p){
  try{
    const dc=getDecoder()||actx;if(!dc||!p||!p.data||!p.data.length)return null;
    const b=dc.createBuffer(1,p.data.length,p.rate);
    if(b.copyToChannel)b.copyToChannel(p.data,0);else b.getChannelData(0).set(p.data);
    return b;
  }catch(e){return null}
}
function prepAudio(list){
  return Promise.all(list.filter(c=>c.kind!=='image'&&!abuf.has(c.id)).map(async c=>{
    const dc=getDecoder()||actx;
    if(!dc||c.blob.size>MAX_DECODE){abuf.set(c.id,null);return}
    abuf.set(c.id,'pending');
    try{
      const ab=await c.blob.arrayBuffer();
      const buf=await new Promise((res,rej)=>{const p=dc.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(()=>{})});
      abuf.set(c.id,buf instanceof AudioBuffer?buf:null);
    }catch(e){abuf.set(c.id,null)} // 소리가 없거나 해독할 수 없는 파일
  }));
}
/* 아이폰 전용 보조 오디오: 소리를 해독하지 못한 클립(앱에서 녹화한 예전 영상 등)의 소리를 영상과 따로 재생.
   아이폰은 "소리 나는 영상"을 사용자가 직접 시작하지 않으면 막아서(두 번째 영상이 재생되지 않던 원인), 영상은 항상 음소거로 두고
   소리만 별도 오디오 요소로 재생. 오디오 요소는 버튼을 누른 순간 한 번 재생해 두면 이후 코드로 계속 재생 가능 */
let isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let fb=null,fbIdx=-1,fbWired=false,fbSilent='';
function silentWavUrl(){ // 소리 없는 아주 짧은 wav (허가를 받아 두기 위한 재생용)
  if(fbSilent)return fbSilent;
  const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let k=0;k<s.length;k++)v.setUint8(o+k,s.charCodeAt(k))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return fbSilent=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function getFb(){
  if(!isIOS)return null;
  if(!fb){fb=new Audio();fb.preload='auto';fb.setAttribute('playsinline','')}
  if(actx&&!fbWired){fbWired=true;try{const s=actx.createMediaElementSource(fb);s.connect(dest);s.connect(prevGain)}catch(e){}} // 내보내기에도 소리가 들어가도록
  return fb;
}
function unlockFb(){ // 사용자가 버튼을 누른 순간(동기)에 호출
  const a=getFb();if(!a||unlockFb.done)return;
  unlockFb.done=true;
  try{a.src=silentWavUrl();const p=a.play();if(p&&p.catch)p.catch(()=>{unlockFb.done=false})}catch(e){unlockFb.done=false}
}
function startClipAudio(i,offset=0,fadeIn=0){
  const c=clips[i];if(!c||!actx)return false;
  if(!hasBuf(c)){ // 해독한 소리가 없으면 아이폰은 보조 오디오로 재생 (다른 기기는 영상 요소의 소리를 사용하므로 여기서는 하지 않음)
    const a=c.kind!=='image'?getFb():null;
    if(!a)return false;
    try{
      fbIdx=i;a.src=c.url;a.muted=false;a.volume=1;
      if(offset>0.05)a.addEventListener('playing',()=>{try{a.currentTime=offset}catch(e){}},{once:true});
      const p=a.play();if(p&&p.catch)p.catch(()=>{});
      return true;
    }catch(e){return false}
  }
  stopClipAudio(i);
  try{
    const buf=abuf.get(c.id),s=actx.createBufferSource(),g=actx.createGain();
    s.buffer=buf;s.connect(g);g.connect(dest);g.connect(prevGain);
    if(fadeIn>0){g.gain.setValueAtTime(0,actx.currentTime);g.gain.linearRampToValueAtTime(1,actx.currentTime+fadeIn)} // 겹치는 동안 서서히 커짐
    s.start(0,Math.min(Math.max(0,offset),Math.max(0,buf.duration-0.01)));
    const o={s,g};liveAudio.set(i,o);s.onended=()=>{if(liveAudio.get(i)===o)liveAudio.delete(i)};
    return true;
  }catch(e){return false}
}
function fadeOutClipAudio(i,sec){ // 겹치는 동안 앞 클립의 소리는 서서히 작아짐
  const o=liveAudio.get(i);if(!o||!actx)return;
  try{const n=actx.currentTime;o.g.gain.cancelScheduledValues(n);o.g.gain.setValueAtTime(o.g.gain.value,n);o.g.gain.linearRampToValueAtTime(0,n+sec)}catch(e){}
}
function stopClipAudio(i){
  if(fb&&fbIdx===i){try{fb.pause()}catch(e){}fbIdx=-1}
  const o=liveAudio.get(i);if(o){try{o.s.onended=null;o.s.stop()}catch(e){}liveAudio.delete(i)}
}
function stopAllAudio(){
  if(fb){try{fb.pause()}catch(e){}fbIdx=-1}
  [...liveAudio.keys()].forEach(stopClipAudio);
}
function pickMime(){
  const c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return window.MediaRecorder?c.find(m=>MediaRecorder.isTypeSupported(m))||'':'';
}

/* ---------- 저장소(IndexedDB) ---------- */
const dbp=new Promise((ok,no)=>{
  try{
    const r=indexedDB.open('clipvlog',2);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains('clips'))db.createObjectStore('clips',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');
      if(!db.objectStoreNames.contains('cmeta'))db.createObjectStore('cmeta',{keyPath:'id'}); // 텍스트·길이 같은 가벼운 정보
    };
    r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
  }catch(e){no(e)}
});
async function dbTx(store,fn){
  try{
    const db=await dbp;
    return await new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const out=fn(tx);tx.oncomplete=()=>res(out&&out.result);tx.onerror=()=>rej(tx.error)});
  }catch(e){}
}
// 영상·사진 파일(큰 데이터)은 클립을 추가할 때 한 번만 저장하고, 텍스트 편집은 가벼운 정보만 저장 (휴대폰에서 매번 파일을 다시 쓰면 느려지고 멈출 수 있음)
const saveBlob=c=>dbTx('clips',tx=>tx.objectStore('clips').put({id:c.id,blob:c.blob,dur:c.dur,thumb:c.thumb,texts:c.texts,kind:c.kind||'video',pcm:c.pcm||null}));
const saveClip=c=>dbTx('cmeta',tx=>tx.objectStore('cmeta').put({id:c.id,texts:c.texts,dur:c.dur}));
const saveOrder=()=>dbTx('meta',tx=>tx.objectStore('meta').put(clips.map(c=>c.id),'order'));
const delClip=id=>dbTx(['clips','cmeta'],tx=>{tx.objectStore('clips').delete(id);tx.objectStore('cmeta').delete(id)});
let st;const saveSoon=c=>{clearTimeout(st);st=setTimeout(()=>saveClip(c),500)};
async function loadAll(){
  try{
    const db=await dbp;
    const get=(s,k)=>new Promise(r=>{const q=db.transaction(s).objectStore(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
    const order=(await get('meta','order'))||[];
    for(const id of order){
      const r=await get('clips',id);
      if(!r)continue;
      const m=await get('cmeta',id); // 있으면 가장 최근 텍스트·길이로 덮어씀 (이전 버전 데이터와도 호환)
      clips.push({...r,...(m?{texts:m.texts,dur:m.dur}:{}),url:URL.createObjectURL(r.blob)});
      if(r.pcm){const pb=bufFromPcm(r.pcm);if(pb)abuf.set(r.id,pb)} // 저장해 둔 녹음 소리 복원
    }
  }catch(e){}
}

/* ---------- 그리기 ---------- */
const easeOut=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function wrap(text,maxW){
  const out=[];
  for(const para of text.split('\n')){
    let line='';
    for(const ch of para){
      if(line&&ctx.measureText(line+ch).width>maxW){out.push(line);line=ch.trim()?ch:''}else line+=ch;
    }
    out.push(line);
  }
  return out;
}
/* 글자 줄바꿈·폭 계산 결과를 저장해 두고 재사용 (매 프레임 글자마다 폭을 재면 사파리에서 특히 느림).
   글꼴이 뒤늦게 로드되면 폭이 달라지므로 그때는 다시 계산 */
const textCache=new WeakMap();
let fontEpoch=0;
try{document.fonts.addEventListener('loadingdone',()=>{fontEpoch++})}catch(e){}
function textLayout(l){
  const fs=fontStr(l),key=fs+'|'+l.text+'|'+fontEpoch;
  let c=textCache.get(l);
  if(!c||c.key!==key){
    ctx.save();ctx.font=fs;
    const lines=wrap(l.text,W*0.88);
    c={key,fs,lines,chars:lines.map(x=>[...x]),total:lines.reduce((s,x)=>s+[...x].length,0),mw:Math.max(1,...lines.map(x=>ctx.measureText(x).width))};
    ctx.restore();
    textCache.set(l,c);
  }
  return c;
}
function drawLayer(l,t){
  if(!l.text)return;
  if(t<l.delay)return;
  const tt=t-l.delay,p=Math.min(1,tt/0.5);
  let a=1,sc=1,dy=0,vis=Infinity;
  switch(l.effect){
    case 'fade':a=p;break;
    case 'pop':sc=Math.max(0.01,easeOutBack(p));a=Math.min(1,p*3);break;
    case 'slide':dy=(1-easeOut(p))*90;a=p;break;
    case 'bounce':dy=-Math.abs(Math.sin(tt*5))*26*Math.min(1,tt*2);break;
    case 'pulse':sc=1+0.07*Math.sin(tt*7);break;
  }
  const c=textLayout(l),lines=c.lines;
  ctx.save();
  ctx.font=c.fs;
  if(l.effect==='type')vis=Math.floor(Math.min(1,tt/Math.min(2.5,Math.max(0.5,c.total*0.09)))*c.total);
  ctx.globalAlpha=a;
  ctx.translate(W*(l.x??50)/100,H*l.y/100+dy);ctx.scale(sc,sc);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  const lh=l.size*1.25,top=-(lines.length-1)*lh/2;
  if(l.box){
    const mw=c.mw;
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(-mw/2-28,top-lh/2-10,mw+56,lines.length*lh+20,22);else ctx.rect(-mw/2-28,top-lh/2-10,mw+56,lines.length*lh+20);
    ctx.fill();
  }
  let left=vis;
  lines.forEach((s,i)=>{
    if(l.effect==='type'){const ch=c.chars[i],n=ch.length;s=ch.slice(0,Math.max(0,Math.min(n,left))).join('');left-=n}
    if(!s)return;
    if(l.sw>0){ctx.strokeStyle=l.stroke;ctx.lineWidth=l.sw*2;ctx.strokeText(s,0,top+i*lh)}
    ctx.fillStyle=l.color;ctx.fillText(s,0,top+i*lh);
  });
  ctx.restore();
}
function drawFrame(clip,t,settled){
  ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const isImg=!!clip&&clip.kind==='image',src=isImg?img:vid;
  const vw=isImg?img.naturalWidth:vid.videoWidth,vh=isImg?img.naturalHeight:vid.videoHeight;
  const k=clip?clips.indexOf(clip):-1;
  if(vw&&vh){
    let s=Math.max(W/vw,H/vh);
    if(isImg&&!settled&&clip.dur>0)s*=1+0.08*Math.min(1,t/clip.dur); // 사진은 천천히 확대
    const tr=transitionOf(clip,k,t,settled);
    if(tr)drawWithTransition(src,vw,vh,s,tr);
    else{
      const dw=vw*s,dh=vh*s;ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
      maybeSnapshot(clip,k,t,settled); // 끝나기 직전이면 이 장면을 저장 (다음 클립 전환의 바탕이 됨)
    }
  }
  if(clip){
    if(k<0)clip.texts.forEach(l=>drawLayer(l,settled?l.delay+10:t));
    else for(const [l,j] of layersFor(k)){
      // 앞 클립에서 시작한 텍스트는 전체 영상 시간으로 이어서 계산 → 클립이 바뀌어도 효과가 다시 시작되지 않고 그대로 유지
      drawLayer(l,settled?l.delay+10:(j===k?t:tlAt(k)-tlAt(j)+t));
    }
  }
}
/* ---------- 클립 전환 효과 ----------
   앞 클립의 마지막 장면을 캡처해 두고, 다음 클립이 시작할 때 그 위로 겹쳐서 나타나게 함 → 검은 화면이 보이지 않음.
   (영상 요소는 하나만 재생하므로 모든 기기에서 안정적이고, 전체 길이와 텍스트 시간이 변하지 않음)
   텍스트는 영상 위에 그대로 유지되고 영상 부분에만 효과가 적용됨 */
const TRANS=[['none','없음'],['fade','페이드'],['white','화이트'],['slide','슬라이드'],['zoom','줌'],['iris','방울'],['curtain','커튼']];
let TR_LEN=0.4; // 다음 클립이 앞 클립과 겹쳐 섞이는 시간(초). 빠르게 0.2 / 보통 0.4(기본) / 느리게 0.7
try{const v=parseFloat(localStorage.getItem('trlen'));if(v>0&&v<=1)TR_LEN=v}catch(e){}
let trKind='fade';
try{const v=localStorage.getItem('tr');if(v&&TRANS.some(x=>x[0]===v))trKind=v}catch(e){}
const snap=document.createElement('canvas'),snapCtx=snap.getContext('2d'); // 앞 클립의 마지막 장면
let snapFor=-1; // snap이 몇 번째 클립의 마지막 장면인지
function clipDur(clip){
  const playingThis=clips[cur]===clip&&clip.kind!=='image'&&isFinite(vid.duration)&&vid.duration>0;
  return playingThis?vid.duration:(clip.dur||0);
}
const trLen=clip=>Math.min(TR_LEN,(clip.dur||TR_LEN)/3);
/* 클립이 끝나기 전 0.4초 동안 영상 장면(텍스트 제외)을 계속 저장해 마지막 장면을 남김 */
function maybeSnapshot(clip,k,t,settled){
  if(settled||trKind==='none'||k<0||k>=clips.length-1)return;
  if(t<trLen(clip)||clipDur(clip)-t>0.4)return;
  if(snap.width!==cv.width||snap.height!==cv.height){snap.width=cv.width;snap.height=cv.height}
  snapCtx.drawImage(cv,0,0);snapFor=k;
}
/* 전환 구간이면 {p:0~1} 아니면 null. 앞 클립의 마지막 장면이 없으면(처음 재생 등) 전환 없이 바로 넘어감 */
function transitionOf(clip,k,t,settled){
  if(settled||trKind==='none'||k<=0||snapFor!==k-1)return null;
  const len=trLen(clip);
  if(len<=0.05||t>=len)return null;
  return {p:Math.max(0,t/len)};
}
function drawWithTransition(src,vw,vh,s,tr,under){
  const e=tr.p*tr.p*(3-2*tr.p); // 부드럽게 시작하고 끝나는 곡선
  const dw=vw*s,dh=vh*s,dx=(W-dw)/2,dy=(H-dh)/2;
  const base=under||(()=>ctx.drawImage(snap,0,0,W,H)); // 아래: 앞 클립의 화면 (겹쳐 재생 중이면 지금 움직이는 화면, 아니면 마지막 장면)
  const media=()=>ctx.drawImage(src,dx,dy,dw,dh);      // 위: 지금 클립
  const about=(z)=>{ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2)}; // 화면 중심 기준 확대
  switch(trKind){
    case 'fade':base();ctx.save();ctx.globalAlpha=e;media();ctx.restore();break; // 서서히 겹쳐 바뀜
    case 'white':{ // 번쩍이며 바뀜
      base();ctx.save();ctx.globalAlpha=e;media();ctx.restore();
      ctx.fillStyle=`rgba(255,255,255,${0.85*Math.sin(Math.PI*e)})`;ctx.fillRect(0,0,W,H);break;
    }
    case 'slide': // 앞 장면은 왼쪽으로 밀려나고 새 장면이 오른쪽에서 밀고 들어옴
      ctx.save();ctx.translate(-e*W,0);base();ctx.restore();
      ctx.save();ctx.translate((1-e)*W,0);media();ctx.restore();break;
    case 'zoom': // 앞 장면은 커지며 사라지고 새 장면은 줄어들며 나타남
      ctx.save();about(1+0.25*e);base();ctx.restore();
      ctx.save();ctx.globalAlpha=e;about(1+0.25*(1-e));media();ctx.restore();break;
    case 'iris': // 방울이 커지며 새 장면을 드러냄
      base();ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,Math.max(0.01,Math.hypot(W,H)/2*e),0,Math.PI*2);ctx.clip();media();ctx.restore();
      if(e>0.02&&e<0.98){ctx.save();ctx.lineWidth=10;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(W/2,H/2,Math.hypot(W,H)/2*e,0,Math.PI*2);ctx.stroke();ctx.restore()}
      break;
    case 'curtain':{ // 가운데에서 커튼이 열리듯 새 장면이 양옆으로 퍼짐
      base();const w=e*W;ctx.save();ctx.beginPath();ctx.rect((W-w)/2,0,w,H);ctx.clip();media();ctx.restore();break;
    }
    default:media();
  }
}

/* 겹쳐 재생: 앞 클립(i)이 끝나기 전에 다음 클립(i+1)도 재생을 시작해서 두 영상이 함께 움직이며 섞임.
   섞이는 정도(p)는 다음 클립이 재생된 시간(tIn)으로 정하므로 두 영상의 시작 시각이 조금 어긋나도 어긋나지 않음. */
const overlapLen=()=>trKind==='none'?0:TR_LEN; // 겹치는 시간(초). 전환 효과가 '없음'이면 겹치지 않고 바로 이어짐
function drawOverlapFrame(i,t,tIn,mov){ // mov: 다음 영상이 출발한 뒤 실제로 움직인 시간 (섞이는 정도를 정함)
  const A=clips[i],B=clips[i+1],va=vid,vb=spare;
  if(!va.videoWidth||!vb.videoWidth)return false; // 아직 그릴 수 없으면 일반 그리기로
  ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const sa=Math.max(W/va.videoWidth,H/va.videoHeight),sb=Math.max(W/vb.videoWidth,H/vb.videoHeight);
  const under=()=>{const dw=va.videoWidth*sa,dh=va.videoHeight*sa;ctx.drawImage(va,(W-dw)/2,(H-dh)/2,dw,dh)};
  drawWithTransition(vb,vb.videoWidth,vb.videoHeight,sb,{p:Math.min(1,Math.max(0,(mov===undefined?tIn:mov)/overlapLen()))},under);
  // 텍스트: 앞 클립에서 이어지는 것은 그대로, 다음 클립에서 새로 시작하는 것은 다음 클립 시간으로
  for(const [l,j] of layersFor(i))drawLayer(l,j===i?t:tlAt(i)-tlAt(j)+t);
  for(const l of B.texts)drawLayer(l,tIn);
  return true;
}

/* 텍스트는 처음 나타난 클립(j)에서 시작해 span개 클립 동안(또는 끝까지) 이어서 표시됨 */
function layersFor(k){
  const out=[];
  for(let j=0;j<=k;j++){
    for(const l of clips[j].texts){
      if(j===k||l.toEnd||k<=j+(l.span||1)-1)out.push([l,j]);
    }
  }
  return out;
}
/* 재생 중 각 클립이 전체 영상에서 시작한 시각(초). 재생하지 않을 때는 클립 길이를 더해서 추정 */
let tlStart=[];
function tlAt(i){
  if(tlStart[i]!==undefined)return tlStart[i];
  let s=0;for(let k=0;k<i;k++)s+=(clips[k].dur||0)-ovAt(k);return s;
}
/* 영상끼리 겹쳐 재생하면 다음 클립이 그만큼 일찍 시작하므로 전체 길이가 짧아짐 (k번째와 k+1번째 클립 사이) */
function ovAt(k){
  if(useSingle||!clips[k+1]||clips[k].kind==='image'||clips[k+1].kind==='image')return 0;
  return Math.min(overlapLen(),(clips[k].dur||0)/2,(clips[k+1].dur||0)/2);
}
const timelineTotal=()=>Math.max(0.1,clips.reduce((s,c,k)=>s+(c.dur||0)-ovAt(k),0));
const redraw=()=>{if(cur>=0&&clips[cur])drawFrame(clips[cur],0,true)};

/* ---------- 재생 ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const withTimeout=(p,ms)=>Promise.race([p,sleep(ms)]);
function loadClip(i,fast){ // fast: 영상이 다 불러와질 때까지 기다리지 않고 바로 돌려줌 (재생 요청이 불러오기를 겸함)
  const c0=clips[i];
  if(c0.kind==='image'){
    cur=i;vid.pause();
    if(img.src===c0.url&&img.complete&&img.naturalWidth)return Promise.resolve();
    return new Promise(res=>{img.onload=img.onerror=()=>res();img.src=c0.url;setTimeout(res,3000)});
  }
  // 미리 불러둔 영상이 있으면 요소를 맞바꿔 바로 사용 (끊김 없는 전환)
  if(!useSingle&&spareIdx===i&&spare.readyState>=2){
    const old=vid;vid=spare;spare=old;spareIdx=-1;cur=i;old.pause();
    return Promise.resolve();
  }
  if(fast){const c=clips[i];cur=i;vid.preload='auto';vid.src=c.url;vid.load();return Promise.resolve()}
  return new Promise(res=>{
    const c=clips[i];cur=i;let done=false;
    const evs=['loadeddata','canplay','error'];
    const fin=()=>{if(done)return;done=true;evs.forEach(e=>vid.removeEventListener(e,fin));res()};
    evs.forEach(e=>vid.addEventListener(e,fin));
    vid.preload='auto';vid.src=c.url;vid.load();setTimeout(fin,3000);
  });
}
/* 다음 클립을 재생 중에 미리 준비 (영상은 spare 요소에 로드, 사진은 디코딩, 글꼴도 미리 로드) */
function preloadNext(i){
  const c=clips[i];if(!c)return;
  ensureFonts(c.texts);
  if(c.kind==='image'){const p=new Image();p.src=c.url;if(p.decode)p.decode().catch(()=>{});return}
  if(useSingle||spareIdx===i)return;
  spareIdx=i;spare.pause();spare.muted=true;spare.preload='auto';spare.src=c.url;spare.load();
  /* 아래 elMuted는 선언이 뒤에 있어도 호출 시점에는 이미 정의됨 */
  // 아이폰은 재생하기 전에는 영상을 미리 불러오지 않으므로, 음소거로 잠깐 재생했다가 멈춰 두어 첫 화면까지 준비시킴
  // (미리 출발이 이미 시작됐으면 멈추지 않음)
  try{
    const w=spare.play();
    if(w&&w.then)w.then(()=>{
      // 0초로 되감지 않고 그 자리에서 멈춰 둠: 아이폰은 되감기(탐색)가 느리고, 되감으면 준비해 둔 상태가 사라져 재생 시작이 다시 늦어짐
      if(spareIdx===i&&prerolledIdx!==i){spare.pause();spare.muted=elMuted(c)}
    }).catch(()=>{});
  }catch(e){}
}
/* 다음 클립 미리 출발: 영상은 play() 호출 뒤 실제로 움직이기까지 지연이 있어서(휴대폰에서 특히 큼),
   그 지연만큼 먼저 spare를 재생해 두었다가 교대하면 클립 시작 때 멈추지 않음. 지연은 실측해서 자동 보정 */
let prerolledIdx=-1;
let preP0=0,preStartT=0,preMeasured=true; // 미리 출발시킨 시각, 그때 다음 영상의 위치, 지연 측정을 마쳤는지
const lagSamples=[]; // 재생을 시작한 뒤 영상이 실제로 움직이기까지 걸린 시간(ms)
/* 앞 클립이 끝나기 얼마 전에 다음 영상을 출발시킬지. 영상이 "움직이기 시작할 때"까지 걸린 시간을 재서, 최근 3번 중 가장 느린 값을 기준으로
   여유를 둠 (평균을 쓰면 가끔 느린 경우에 앞 클립이 끝났는데 다음 영상이 아직 안 움직여서 멈춰 보임) */
function leadSec(){
  if(!lagSamples.length)return 0.3;
  const m=Math.max(...lagSamples.slice(-3));
  return Math.min(1200,Math.max(50,m+30))/1000;
}
/* 아이폰은 사용자가 직접 시작하지 않은 영상의 소리 재생을 막아서 시도하면 거부된 뒤 다시 시도하느라 멈춤 → 영상은 항상 음소거,
   소리는 해독한 오디오로만 재생 (해독하지 못한 클립은 무음). 다른 기기는 해독하지 못한 클립만 영상 요소의 소리를 사용 */
const elMuted=clip=>isIOS||hasBuf(clip); // 아이폰은 영상을 항상 음소거(소리는 오디오로 따로). 다른 기기는 해독한 소리가 없는 클립만 영상 요소의 소리를 사용
const diag={transitions:[]}; // 진단: 가장 최근 재생에서 클립 사이마다 두 영상이 멈춰 있던 시간 등
let prevEndAt=0; // 앞 클립이 끝난 시각 (다음 클립이 실제로 움직이기까지 걸린 시간을 재기 위함)
function startPreroll(idx){
  const v=spare;
  preP0=performance.now();preStartT=v.currentTime;preMeasured=false;
  prerolledIdx=idx;v.muted=elMuted(clips[idx]);
  const undo=()=>{prerolledIdx=-1;stopClipAudio(idx)};
  const O=overlapLen();
  const startSound=()=>{
    if(prerolledIdx!==idx)return;
    startClipAudio(idx,v.currentTime,O);   // 다음 클립의 소리는 서서히 커지고
    if(O>0)fadeOutClipAudio(idx-1,O);      // 앞 클립의 소리는 서서히 작아짐
  };
  try{
    const pr=v.play();
    // 영상이 실제로 움직이기 시작하는 순간에 소리도 같이 시작
    if(pr&&pr.then)pr.then(startSound,err=>{
      undo();
      // 두 번째 영상의 재생이 확실히 거부됐으면 앞으로는 겹치지 않고 하나로 이어붙임 (재생 중인 영상·소리는 건드리지 않음)
      if(err&&err.name==='NotAllowedError'&&!useSingle){
        useSingle=true;diagInfo.single='두 번째 영상 재생이 거부됨(NotAllowedError)';
        try{localStorage.setItem('single3','1')}catch(e){}
      }
    });
    else startSound();
  }catch(e){undo()}
}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const totalDur=()=>clips.reduce((s,c)=>s+(c.dur||0),0);
let lastProgAt=0;
function updateProgress(i,t,force){
  const now=performance.now();
  if(!force&&now-lastProgAt<90)return; // 화면 글자·막대는 초당 10번 정도만 갱신 (매 프레임 갱신하면 화면 배치를 계속 다시 계산해서 느려짐)
  lastProgAt=now;
  const done=tlAt(i)+t,tot=timelineTotal(); // 겹쳐 재생하는 만큼 짧아진 전체 길이 기준
  const frac=Math.min(1,Math.max(0,done/tot));
  $('#prog i').style.width=frac*100+'%';
  $('#expBar i').style.width=frac*100+'%';
  $('#time').textContent=fmt(done)+' / '+fmt(tot);
}
/* 반환: 'done'(끝까지 재생) | 'cancel'(중지·취소됨) | 'fail'(재생 시작 실패) */
async function playRange(from,only,startAt=0){ // startAt: 첫 클립을 이 시각(초)부터 재생 (전환 미리보기용)
  const token=++runToken;
  const last=typeof only==='number'?only:(only?from:clips.length-1); // only: true=이 클립만, 숫자=그 클립까지
  prerolledIdx=-1;
  diag.transitions=[]; // 이번 재생의 진단 기록을 새로 시작
  snapFor=-1; // 새로 재생을 시작하면 이전 장면 캡처는 무효
  const base=tlAt(from);tlStart=[];tlStart[from]=base-startAt; // 전체 영상 시간 기록 시작 (일부만 재생해도 앞 클립 길이만큼 이어진 상태로 시작)
  // 재생할 모든 클립의 글꼴을 시작 전에 한꺼번에 준비 → 클립이 바뀔 때마다 글꼴을 기다리지 않음
  stopAllAudio();
  // 글꼴과 소리(해독)를 재생 전에 준비. 앱을 열거나 클립을 추가할 때 이미 해 두었으므로 보통 바로 끝남
  await Promise.all([
    withTimeout(ensureFonts(clips.slice(from,last+1).flatMap(c=>c.texts)),1500),
    withTimeout(prepAudio(clips.slice(from,last+1)),2500)
  ]);
  if(token!==runToken)return 'cancel';
  for(let i=from;i<=last;i++){
    if(token!==runToken)return 'cancel';
    await loadClip(i,true); // 미리 불러둔 영상이면 즉시 교대, 아니면 불러오기만 시작하고 바로 재생을 요청
    vid.muted=elMuted(clips[i]); // 소리는 따로 해독한 오디오로 재생하므로 영상은 음소거
    if(token!==runToken)return 'cancel';
    if(actx&&actx.state!=='running'){try{actx.resume()}catch(e){}} // 기다리지 않음 (클립이 시작될 때마다 기다리면 그만큼 멈춤)
    const isImg=clips[i].kind==='image';
    const wasPre=prerolledIdx===i; // 이미 미리 출발해 재생 중인 영상이면 다시 시작하지 않음
    prerolledIdx=-1;
    let lagP0=0; // 영상을 시작시킨 시각 (움직이기 시작할 때까지의 지연을 재기 위함)
    if(!isImg&&!wasPre){
      try{
        const at=(i===from&&startAt>0)?startAt:0;
        if(at>0||vid.currentTime>0.01)vid.currentTime=at;
      }catch(e){}
      let started=true,played=false;
      lagP0=performance.now();
      try{
        // 두 번째 요소는 시작하지 못하는 기기가 있어 대기를 짧게 하고, 못 시작하면 아래에서 단일 모드로 복구
        await withTimeout(Promise.resolve(vid.play()).then(()=>{played=true}),vid===vids[0]?3000:1200);
      }
      catch(e){
        // 자동재생 차단 등: 미리보기에서만 음소거로 한 번 더 시도
        started=false;
        if(!exporting){vid.muted=true;try{await withTimeout(vid.play(),2000);started=true}catch(e2){}}
      }
      if(!started){toast(`클립 ${i+1} 재생을 시작하지 못했어요`);return 'fail'}
      startClipAudio(i,vid.currentTime); // 영상이 움직이기 시작하는 순간 소리 시작 (해독된 오디오가 있을 때)
    }
    if(i<last)preloadNext(i+1); // 지금 클립이 재생되는 동안 다음 클립 준비
    let retry=false,endT=0,inT=0,maxStill=0; // inT: 겹쳐 재생하다 넘어가는 순간 다음 클립이 이미 재생된 시간, maxStill: 두 영상이 모두 멈춰 있던 가장 긴 시간(ms)
    let gapMs=-1,t0clip=-1; // gapMs: 앞 클립이 끝난 뒤 이 클립이 실제로 움직이기까지 걸린 시간(ms)
    await new Promise(res=>{
      let finished=false,lastT=-1,lastAdv=performance.now(),stalls=0,gen=0,pre=false,preTimer=null,endedAt=0;
      let lastMoveAt=performance.now(),la=-1,lb=-1;
      const tStart=performance.now()-((i===from&&startAt>0)?startAt*1000:0); // 사진 클립은 시계로 길이를 잼
      const O=overlapLen(); // 다음 클립과 겹쳐 재생하는 시간
      const movedIn=()=>spare.currentTime-preStartT; // 미리 출발한 다음 영상이 실제로 움직인 시간(초). 출발 위치를 빼서 계산
      // 다음 클립이 앞 클립과 함께 움직이며 섞이는 중인지
      const blending=()=>pre&&O>0&&!useSingle&&movedIn()>0.02&&movedIn()<O*0.98;
      // 앞 클립이 끝났어도 섞이는 중이면 섞기가 끝날 때까지 기다림 (최대 0.6초)
      const mayFinish=()=>!blending()||(endedAt>0&&performance.now()-endedAt>=600);
      const onEnded=()=>{if(!endedAt)endedAt=performance.now();if(mayFinish())finish()};
      const finish=()=>{if(finished)return;finished=true;clearTimeout(preTimer);vid.removeEventListener('ended',onEnded);res()};
      // 다음 영상 미리 출발 (준비가 안 됐으면 false)
      const tryPre=()=>{
        if(pre||finished||token!==runToken)return false;
        if(useSingle||i>=last||clips[i+1].kind==='image'||spareIdx!==i+1)return false; // 준비 상태(readyState)는 따지지 않음: 아이폰은 재생을 시작해야 불러옴
        pre=true;startPreroll(i+1);return true;
      };
      vid.addEventListener('ended',onEnded);
      // rAF와 타이머를 함께 걸어 두고 먼저 오는 쪽만 실행 (화면이 가려져 rAF가 멈춰도 다음 클립으로 넘어가도록)
      const step=g=>{
        if(finished||g!==gen)return;
        gen++;
        if(token!==runToken){finish();return}
        try{
          const t=isImg?(performance.now()-tStart)/1000:vid.currentTime;
          endT=t;
          const nowT=performance.now();
          if(!isImg&&prevEndAt&&i>from&&gapMs<0){ // 앞 클립이 끝난 뒤 이 클립이 움직이기 시작하기까지 (재생 요청을 기다린 시간 포함)
            if(t0clip<0)t0clip=t;
            else if(t-t0clip>0.02)gapMs=Math.round(nowT-prevEndAt);
          }
          if(!isImg){ // 두 영상 중 하나라도 시간이 흐르지 않은 채 얼마나 오래 있었는지 기록 (진단용)
            const a=vid.currentTime,b=spare.currentTime;
            if(a!==la||b!==lb){lastMoveAt=nowT;la=a;lb=b}
            maxStill=Math.max(maxStill,nowT-lastMoveAt);
          }
          // 영상이 실제로 움직이기 시작할 때까지의 지연을 재서 다음 영상을 얼마나 일찍 출발시킬지 정하는 데 사용
          if(pre&&!preMeasured&&movedIn()>0.02){preMeasured=true;lagSamples.push(nowT-preP0);if(lagSamples.length>4)lagSamples.shift()}
          if(lagP0&&t-((i===from)?startAt:0)>0.03){lagSamples.push(nowT-lagP0);if(lagSamples.length>4)lagSamples.shift();lagP0=0}
          // 다음 클립이 이미 움직이고 있으면 두 영상을 함께 그려서 섞음, 아니면 이 클립만 그림
          const tIn=spare.currentTime;
          if(pre&&O>0&&!useSingle&&!isImg&&spareIdx===i+1&&movedIn()>0.02&&drawOverlapFrame(i,t,tIn,movedIn()))inT=tIn;
          else if(isImg||vid.readyState>=2)drawFrame(clips[i],t); // 새 영상의 첫 화면이 준비되기 전에는 다시 그리지 않음 (검은 화면이 번쩍이지 않게 앞 화면을 유지)
          updateProgress(i,t);
          if(isImg){
            if(t>=clips[i].dur){finish();return}
          }else{
            if(vid.ended){
              if(!endedAt)endedAt=performance.now();
              if(mayFinish()){finish();return}
            }
            const d=clips[i].dur;
            if(d>0&&t>=d+1){finish();return} // ended 신호가 오지 않을 때의 안전장치
            const end=isFinite(vid.duration)?vid.duration:(d||Infinity);
            if(vid.paused&&t>0&&t>=end-0.35&&mayFinish()){finish();return} // 끝에서 멈췄는데 ended가 안 온 경우
            // 겹치는 시간(O)과 재생 시작 지연만큼 일찍 다음 영상을 먼저 재생해서, 앞 클립이 끝나기 전에 두 영상이 함께 움직이게 함.
            // 화면 갱신이 느려도 제때 출발하도록 타이머를 직접 걸어 둠
            if(!pre){
              const remain=end-t-(O+leadSec());
              if(remain<=0)tryPre();
              else if(!preTimer&&isFinite(remain)){preTimer=setTimeout(()=>{preTimer=null;if(!tryPre())preTimer=null},Math.max(0,remain*1000-5))}
            }
            // 섞기가 끝났으면 바로 다음 클립으로 (앞 클립의 'ended' 신호는 늦게 올 수 있어서 기다리지 않음)
            if(pre&&O>0&&!useSingle&&movedIn()>=O){inT=spare.currentTime;finish();return}
            // 겹치지 않는 설정(전환 없음)이면: 다음 영상이 움직이고 이 클립이 거의 끝났을 때 바로 넘어감
            if(pre&&O===0&&movedIn()>0.02&&end-t<=0.04){finish();return}
            const now=performance.now();
            if(t!==lastT){lastT=t;lastAdv=now}
            else if(vid!==vids[0]&&!useSingle&&now-lastAdv>1200){
              // 두 번째 영상 요소가 시작하지 못함 → 단일 요소 모드로 바꾸고 이 클립을 처음부터 다시 재생
              retry=true;finish();enterSingle('두 번째 영상 요소가 재생되지 않음');return;
            }
            else if(now-lastAdv>3000){ // 3초 동안 시간이 안 흐르면 재시도 → 그래도 멈추면 다음 클립으로
              stalls++;lastAdv=now;
              if(stalls>=2){toast(`클립 ${i+1}이 멈춰서 다음으로 넘어가요`);finish();return}
              try{vid.play()}catch(e){}
            }
          }
        }catch(e){console.error(e)} // 그리기 오류가 나도 반복이 죽지 않게
        const go=gen;
        requestAnimationFrame(()=>step(go));
        setTimeout(()=>step(go),200);
      };
      step(gen);
    });
    if(!isImg)diag.transitions.push({clip:i+1,방식:i===from?'첫 클립':(inT>0?'겹침':'이어붙임'),최장멈춤ms:Math.round(maxStill),넘어가는데ms:gapMs}); // 진단 기록
    prevEndAt=performance.now();
    stopClipAudio(i); // 이 클립의 소리는 클립이 끝나면 함께 끝냄 (미리 출발한 다음 클립의 소리는 그대로)
    if(retry&&token===runToken){i--;continue} // 같은 클립을 단일 모드로 다시
    // 다음 클립은 이 클립이 실제로 끝난 시각에서 이어서 시작 (이어 표시되는 텍스트의 효과 시간이 끊기지 않게)
    // 겹쳐 재생했다면 다음 클립은 이미 inT만큼 재생된 상태이므로 그만큼 앞당겨서 시작한 것으로 계산
    tlStart[i+1]=tlAt(i)+(isImg?clips[i].dur:(endT>0?endT:(clips[i].dur||0)))-inT;
  }
  return token===runToken?'done':'cancel';
}
function stopPlay(){runToken++;prerolledIdx=-1;stopAllAudio();vids.forEach(v=>v.pause());playing=false;setPlayUI()}
function setPlayUI(){
  $('#btnPlay').textContent=playing?'⏸':'▶';
  document.body.classList.toggle('busy',playing||exporting); // 재생·내보내기 중에는 화면 효과를 꺼서 영상에 자원을 몰아줌
}
async function togglePlay(only){
  initAudio();
  if(playing){stopPlay();return}
  if(!clips.length)return;
  applyVol();
  playing=true;setPlayUI();
  // ▶는 항상 처음부터 전체 재생 (편집하느라 마지막 클립이 선택된 상태에서 누르면 그 클립만 재생되던 문제)
  const r=await playRange(0,false);
  if(r==='cancel')return; // 중지·재시작된 경우 새 재생이 상태를 관리
  playing=false;setPlayUI();
  if(r==='done')await selectClip(0);
}
/* 목록에서 클립을 누르면 그 클립 하나만 재생 (재생 중이면 멈추고 눌린 클립부터 다시 재생) */
async function playClipAt(i){
  initAudio();
  if(playing)stopPlay();
  applyVol();
  cur=i;playing=true;setPlayUI();renderList();
  const r=await playRange(i,true);
  if(r==='cancel')return; // 다른 재생이 시작되었거나 중지됨
  playing=false;setPlayUI();
  if(r==='done')await selectClip(i);
}
async function selectClip(i){
  if(playing)stopPlay();
  if(i<0||i>=clips.length){cur=-1;drawFrame(null,0);renderList();return}
  await loadClip(i);
  if(clips[i].kind!=='image')await new Promise(r=>{vid.addEventListener('seeked',r,{once:true});try{vid.currentTime=0.05}catch(e){}setTimeout(r,500)});
  await withTimeout(ensureFonts(clips[i].texts),2000); // 글꼴이 안 불러와져도 화면이 멈추지 않게
  drawFrame(clips[i],0,true);
  updateProgress(i,0,true);
  renderList();
}

/* ---------- 클립 목록 ---------- */
function renderList(){
  const L=$('#list');
  if(!clips.length){L.innerHTML='<div class="empty"><span class="big">🫧</span>아직 방울이 없어요<br>아래 <b>● 촬영</b>으로 2~5초씩 담거나<br>📁 가져오기로 영상을 추가해 보세요</div>';return}
  L.innerHTML='';
  clips.forEach((c,i)=>{
    const d=document.createElement('div');d.className='card'+(i===cur?' sel':'')+(c.isNew?' new':'');c.isNew=false;
    d.innerHTML=`${c.thumb?`<img src="${c.thumb}">`:'<div class="noimg"></div>'}
      <div class="meta"><b>#${i+1} · ${c.dur?c.dur.toFixed(1)+'초':'?'}${c.kind==='image'?' · 🖼 사진':''}</b><span>${c.texts.length?c.texts.map(t=>t.text.replace(/\n/g,' ')+(t.toEnd?' ➜끝까지':((t.span||1)>1?' ➜'+t.span+'개':''))).join(' / '):'텍스트 없음'}</span></div>
      <div class="btns"><button data-a="edit">✎</button><button data-a="del">🗑</button></div>
      <div class="grip" title="끌어서 순서 바꾸기">⠿</div>`;
    d.dataset.i=i;
    d.onclick=e=>{ // 카드를 누르면 그 클립 재생, ✎는 수정, 🗑는 삭제(되돌리기 가능)
      if(e.target.closest('.grip'))return;
      if(e.target.closest('[data-a="del"]'))deleteClip(i);
      else if(e.target.closest('[data-a="edit"]'))openSheet(i);
      else playClipAt(i);
    };
    d.querySelector('.grip').addEventListener('pointerdown',e=>startReorder(e,d,i));
    L.appendChild(d);
  });
  const tot=timelineTotal();$('#time').textContent=(playing||exporting?$('#time').textContent:'0:00 / '+fmt(tot));
}
/* 순서 바꾸기: 오른쪽 ⠿ 손잡이를 잡고 위아래로 끌면 카드가 따라 움직이고, 놓으면 그 자리로 확정 */
function startReorder(e,card,from){
  e.preventDefault();e.stopPropagation();
  const L=$('#list'),cards=[...L.children],h=card.offsetHeight+8,y0=e.clientY,sc0=L.scrollTop;
  let to=from;
  card.classList.add('dragging');try{card.setPointerCapture(e.pointerId)}catch(_){}
  const place=()=>{
    const dy=curY-y0+(L.scrollTop-sc0);
    card.style.transform=`translateY(${dy}px)`;
    to=Math.max(0,Math.min(cards.length-1,from+Math.round(dy/h)));
    cards.forEach((c,k)=>{if(c===card)return;c.style.transform=(from<to&&k>from&&k<=to)?`translateY(${-h}px)`:(to<from&&k<from&&k>=to)?`translateY(${h}px)`:''});
  };
  let curY=y0,raf=0;
  const auto=()=>{ // 목록 위·아래 끝에 가까우면 자동으로 스크롤
    const r=L.getBoundingClientRect();
    if(curY<r.top+50)L.scrollTop-=10;else if(curY>r.bottom-50)L.scrollTop+=10;
    place();raf=requestAnimationFrame(auto);
  };
  raf=requestAnimationFrame(auto);
  const move=ev=>{curY=ev.clientY;place()};
  const end=()=>{
    cancelAnimationFrame(raf);
    card.removeEventListener('pointermove',move);card.removeEventListener('pointerup',end);card.removeEventListener('pointercancel',end);
    if(to!==from){
      const [m]=clips.splice(from,1);clips.splice(to,0,m);
      if(cur===from)cur=to;else if(from<cur&&cur<=to)cur--;else if(to<=cur&&cur<from)cur++;
      saveOrder();
    }
    renderList();
  };
  card.addEventListener('pointermove',move);card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}
/* 삭제: 확인창 없이 바로 지우고, 5초 동안 "되돌리기"를 보여 줌. 시간이 지나면 저장된 데이터까지 완전히 삭제 */
let pendingDel=null;
function commitDel(){
  const p=pendingDel;if(!p)return;pendingDel=null;clearTimeout(p.t);$('#undo').classList.remove('show');
  delClip(p.c.id);abuf.delete(p.c.id);URL.revokeObjectURL(p.c.url);
}
function deleteClip(i){
  commitDel(); // 앞서 지운 것이 남아 있으면 먼저 확정
  const [c]=clips.splice(i,1);
  pendingDel={c,i,t:setTimeout(commitDel,5000)};
  saveOrder();
  $('#undo').classList.add('show');
  if(clips.length)selectClip(Math.min(i,clips.length-1));else{cur=0;renderList();drawFrame(null,0)}
}
$('#undoBtn').onclick=async()=>{
  const p=pendingDel;if(!p)return;pendingDel=null;clearTimeout(p.t);$('#undo').classList.remove('show');
  clips.splice(Math.min(p.i,clips.length),0,p.c);saveOrder();
  await selectClip(Math.min(p.i,clips.length-1));
};
async function addClip(blob,dur,thumb,kind,pcm){
  const c={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),blob,url:URL.createObjectURL(blob),dur:dur||0,thumb:thumb||'',texts:[],kind:kind||'video',pcm:pcm||null,isNew:true};
  clips.push(c);
  // 앱에서 녹화한 영상은 녹화 중에 받아 둔 소리를 그대로 사용(해독 불필요). 가져온 영상은 백그라운드에서 소리를 미리 해독
  const pb=pcm?bufFromPcm(pcm):null;
  if(pb)abuf.set(c.id,pb);else prepAudio([c]);
  await saveBlob(c);await saveOrder();
  return c;
}
function makeThumb(url){
  return new Promise(res=>{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
    let done=false;const fin=r=>{if(!done){done=true;res(r)}};
    v.onloadedmetadata=()=>{v.currentTime=Math.min(0.3,((isFinite(v.duration)?v.duration:1))/2)};
    v.onseeked=()=>{
      const c=document.createElement('canvas');c.width=90;c.height=160;const x=c.getContext('2d');
      const s=Math.max(90/v.videoWidth,160/v.videoHeight);x.drawImage(v,(90-v.videoWidth*s)/2,(160-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);
      fin({thumb:c.toDataURL('image/jpeg',.7),dur:isFinite(v.duration)?v.duration:0});
    };
    v.onerror=()=>fin({thumb:'',dur:0});
    setTimeout(()=>fin({thumb:'',dur:isFinite(v.duration)?v.duration:0}),4000);
    v.src=url;
  });
}
function makeImageThumb(url){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=90;c.height=160;
      const s=Math.max(90/im.naturalWidth,160/im.naturalHeight);
      c.getContext('2d').drawImage(im,(90-im.naturalWidth*s)/2,(160-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s);
      res(c.toDataURL('image/jpeg',.7));
    };
    im.onerror=()=>res(null);
    im.src=url;
  });
}
const PHOTO_SEC=3; // 사진 기본 길이(초)
async function importFiles(files){
  let added=0;
  for(const f of files){
    const url=URL.createObjectURL(f);
    if(f.type.startsWith('image/')){
      const th=await makeImageThumb(url);URL.revokeObjectURL(url);
      if(th===null){toast('사진을 열 수 없어요: '+f.name);continue}
      await addClip(f,PHOTO_SEC,th,'image');added++;continue;
    }
    const m=await makeThumb(url);URL.revokeObjectURL(url);
    await addClip(f,m.dur,m.thumb);added++;
  }
  if(!added)return;
  toast(added+'개 추가됨');
  await selectClip(clips.length-1);
}
$('#fImport').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
$('#fNative').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};

function snapCam(){

  const c=document.createElement('canvas');c.width=90;c.height=160;
  const s=Math.max(90/v.videoWidth,160/v.videoHeight);
  c.getContext('2d').drawImage(v,(90-v.videoWidth*s)/2,(160-v.videoHeight*s)/2,v.videoWidth*s,v.videoHeight*s);
  return c.toDataURL('image/jpeg',.7);
}
function startRec(){
  recChunks=[];recThumb='';
  const m=pickMime();
  try{rec=new MediaRecorder(camStream,m?{mimeType:m}:{})}catch(e){toast('녹화를 시작할 수 없어요');return}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  rec.onstop=async()=>{
    const dur=(performance.now()-recT0)/1000;
    const blob=new Blob(recChunks,{type:rec.mimeType||m||'video/webm'});
    const pcm=stopPcm(); // 녹화하는 동안 따로 받아 둔 소리
    rec=null;$('#recBtn').classList.remove('rec');$('#cdown').textContent='';
    clearInterval(recTimer);
    if(dur<0.4){toast('너무 짧아요');return}
    await addClip(blob,dur,recThumb,undefined,pcm);
    shot++;$('#camCount').textContent=shot+'개';
    if(navigator.vibrate)navigator.vibrate(30);
  };
  rec.start();recT0=performance.now();startPcm();
  setTimeout(()=>{recThumb=snapCam()},300);
  $('#recBtn').classList.add('rec');
  recTimer=setInterval(()=>{
    const left=maxSec-(performance.now()-recT0)/1000;
    $('#cdown').textContent=Math.max(0,Math.ceil(left));
    if(left<=0)stopRec();
  },100);
  $('#cdown').textContent=maxSec;
}
function stopRec(){if(rec&&rec.state!=='inactive'){clearInterval(recTimer);rec.stop()}}

/* ---------- 텍스트 편집 시트 ---------- */
let ei=-1,li=0;
const layer=()=>clips[ei]&&clips[ei].texts[li];
function buildChips(){
  const fc=$('#fontChips');fc.innerHTML='';
  FONTS.forEach(f=>{const b=document.createElement('button');b.textContent='가나다 Abc';b.style.fontFamily=`"${f.n}"`;b.style.fontWeight=f.w||400;b.dataset.f=f.n;b.title=f.n;b.onclick=()=>{const l=layer();if(!l)return;l.font=f.n;changed(true)};fc.appendChild(b)});
  const xc=$('#fxChips');xc.innerHTML='';
  EFFECTS.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.style.fontSize='14px';b.dataset.x=k;b.onclick=()=>{const l=layer();if(!l)return;l.effect=k;changed();togglePlayOnce()};xc.appendChild(b)});
}
function syncSheet(){
  const c=clips[ei];if(!c)return;
  $('#shTitle').textContent=`클립 #${ei+1} 텍스트`;
  const isImg=c.kind==='image';
  $('#imgRow').hidden=!isImg;
  if(isImg){$('#fImgDur').value=c.dur;$('#imgDurVal').textContent=c.dur+'초'}
  const tabs=$('#tabs');tabs.innerHTML='';
  c.texts.forEach((_,k)=>{const b=document.createElement('button');b.textContent='T'+(k+1);if(k===li)b.className='pri';b.onclick=()=>{li=k;syncSheet()};tabs.appendChild(b)});
  const add=document.createElement('button');add.textContent='＋ 텍스트 추가';add.onclick=()=>{const n=newLayer();if(c.texts.length)n.y=Math.max(10,c.texts[c.texts.length-1].y-15);c.texts.push(n);li=c.texts.length-1;syncSheet();changed(true)};tabs.appendChild(add);
  const l=layer();
  $('#fText').disabled=!l;
  // 표시 범위: 이 클립만 / N개 클립 동안 / 끝까지. 한 번 나타난 텍스트는 효과를 다시 시작하지 않고 그대로 이어서 표시됨
  const sp=$('#fSpan'),rem=clips.length-ei;
  sp.innerHTML='';sp.disabled=!l;
  for(let n=1;n<=rem;n++){
    const o=document.createElement('option');o.value=n;
    o.textContent=n===1?'이 클립만':(n===rem?`끝까지 (마지막 클립까지 ${n}개)`:`${n}개 클립 동안 이어서`);
    sp.appendChild(o);
  }
  if(!l)return;
  sp.value=l.toEnd?rem:Math.min(l.span||1,rem);
  $('#fText').value=l.text;$('#fSize').value=l.size;$('#fY').value=l.y;$('#fDelay').value=l.delay;$('#fSw').value=l.sw;
  $('#fColor').value=l.color;$('#fStroke').value=l.stroke;$('#fBox').checked=l.box;
  document.querySelectorAll('#fontChips button').forEach(b=>b.classList.toggle('on',b.dataset.f===l.font));
  document.querySelectorAll('#fxChips button').forEach(b=>b.classList.toggle('on',b.dataset.x===l.effect));
}
async function changed(needFonts){
  const c=clips[ei];if(!c)return;
  if(needFonts)await withTimeout(ensureFonts(c.texts),2000);
  syncChipsOnly();redraw();saveSoon(c);renderListKeep();
}
function syncChipsOnly(){
  const l=layer();if(!l)return;
  document.querySelectorAll('#fontChips button').forEach(b=>b.classList.toggle('on',b.dataset.f===l.font));
  document.querySelectorAll('#fxChips button').forEach(b=>b.classList.toggle('on',b.dataset.x===l.effect));
}
function renderListKeep(){const y=$('#list').scrollTop;renderList();$('#list').scrollTop=y}
async function openSheet(i){
  ei=i;li=0;
  if(!clips[i].texts.length)clips[i].texts.push(newLayer());
  await selectClip(i);
  $('#sheet').hidden=false;syncSheet();
  await withTimeout(ensureFonts(clips[i].texts),2000);redraw();saveClip(clips[i]);
}
$('#shDel').onclick=()=>{$('#sheet').hidden=true;if(playing)stopPlay();deleteClip(ei)};
$('#shClose').onclick=()=>{$('#sheet').hidden=true;if(playing)stopPlay();selectClip(ei);saveClip(clips[ei]);renderList()};
const bind=(id,key,conv=v=>v)=>$(id).addEventListener('input',e=>{const l=layer();if(!l)return;l[key]=conv(e.target.type==='checkbox'?e.target.checked:e.target.value);changed(key==='size'||key==='text')});
bind('#fText','text');bind('#fSize','size',Number);bind('#fY','y',Number);bind('#fDelay','delay',Number);bind('#fSw','sw',Number);
bind('#fColor','color');bind('#fStroke','stroke');bind('#fBox','box');
$('#fImgDur').addEventListener('input',e=>{
  const c=clips[ei];if(!c)return;
  c.dur=parseFloat(e.target.value);$('#imgDurVal').textContent=c.dur+'초';
  saveSoon(c);renderListKeep();
});
/* 캔버스에서 드래그로 텍스트 이동 (가장 가까운 텍스트를 잡음) */
let drag=null;
const cpos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{
  const c=clips[ei];if($('#sheet').hidden||!c||!c.texts.length||playing)return;
  const[px,py]=cpos(e);let best=0,bd=1e9;
  c.texts.forEach((l,k)=>{const d=Math.hypot((l.x??50)-px,(l.y-py)*0.56);if(d<bd){bd=d;best=k}});
  li=best;const l=c.texts[li];
  drag={dx:(l.x??50)-px,dy:l.y-py};cv.setPointerCapture(e.pointerId);syncSheet();
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;const l=layer();if(!l)return;const[px,py]=cpos(e);
  l.x=Math.min(100,Math.max(0,px+drag.dx));l.y=Math.min(100,Math.max(0,py+drag.dy));
  $('#fY').value=l.y;redraw();
});
const endDrag=()=>{if(!drag)return;drag=null;const c=clips[ei];if(c)saveSoon(c)};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('#fDel').onclick=()=>{const c=clips[ei];if(!c||!c.texts.length)return;c.texts.splice(li,1);li=Math.max(0,li-1);syncSheet();redraw();saveClip(c);renderListKeep()};
/* 모든 클립에 한꺼번에 적용 */
/* 글자와 스타일을 함께, 다른 모든 클립의 같은 번호(T1이면 T1) 텍스트로 적용. 그 번호의 텍스트가 없는 클립에는 새로 추가 */
$('#fAll').onclick=()=>{
  const l=layer();if(!l||!l.text)return;
  if(l.toEnd||(l.span||1)>1){toast('이 텍스트는 이미 여러 클립에 이어서 표시돼요 (복사하면 중복돼요)');return}
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const others=clips.filter(c=>c!==clips[ei]);
  const replace=others.filter(c=>c.texts[li]&&!same(c.texts[li],l)); // 기존 텍스트를 덮어쓸 클립
  const add=others.filter(c=>!c.texts[li]);                          // 새로 추가할 클립
  if(!replace.length&&!add.length){toast('이미 모든 클립에 똑같이 들어 있어요');return}
  const withText=replace.filter(c=>c.texts[li].text!==l.text).length;
  if(withText&&!confirm(`다른 클립 ${withText}개에 이미 있는 T${li+1} 텍스트의 글자가 이 텍스트로 바뀌어요. 계속할까요?`))return;
  replace.forEach(c=>{c.texts[li]={...l};saveClip(c)});
  add.forEach(c=>{c.texts.push({...l});saveClip(c)});
  renderListKeep();
  toast(`다른 클립 ${replace.length+add.length}개에 적용했어요`);
};
$('#fSpan').addEventListener('change',e=>{
  const l=layer();if(!l)return;
  const rem=clips.length-ei,n=parseInt(e.target.value,10)||1;
  l.span=n;l.toEnd=(n===rem&&rem>1); // 끝까지를 고르면 클립이 더 추가돼도 계속 끝까지 이어짐
  changed();
});
/* 전환 효과 고르기 + 클립 1→2 사이를 바로 미리 보기 */
(()=>{
  const box=$('#trChips');
  const sync=()=>box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===trKind));
  TRANS.forEach(([k,n])=>{
    const b=document.createElement('button');b.textContent=n;b.dataset.k=k;
    b.onclick=()=>{
      trKind=k;try{localStorage.setItem('tr',k)}catch(e){}
      sync();
      if(k!=='none')previewTransition();
    };
    box.appendChild(b);
  });
  sync();
})();
let previewSeq=0;
async function previewTransition(){
  if(clips.length<2){toast('클립이 2개 이상일 때 전환 효과가 보여요');return}
  const my=++previewSeq; // 효과 버튼을 연달아 눌러도 앞 미리보기의 뒷정리가 새 미리보기를 멈추지 않게
  if(playing)stopPlay();
  initAudio();applyVol();
  playing=true;setPlayUI();
  const startAt=Math.max(0,(clips[0].dur||1)-0.8); // 첫 클립 끝 0.8초 전부터
  let finished=false;
  const run=playRange(0,1,startAt).then(r=>{finished=true;return r});
  let enter=0;
  while(!finished){
    // 두 번째 클립으로 넘어온 지 0.9초가 지나 전환이 끝나면 미리보기 종료 (사진·영상 모두 같은 방식으로 잼)
    if(playing&&cur===1){
      if(!enter)enter=performance.now();
      if(performance.now()-enter>900){stopPlay();break}
    }
    await sleep(40);
  }
  await run;
  if(my!==previewSeq)return; // 그 사이 새 미리보기가 시작됐으면 그쪽이 정리함
  playing=false;setPlayUI();
  await selectClip(0);
}
$('#fPlay').onclick=()=>togglePlayOnce();
async function togglePlayOnce(){
  if(playing){stopPlay()}
  initAudio();applyVol();
  playing=true;setPlayUI();
  // 미리보기는 이 텍스트가 표시되는 범위(여러 클립에 이어지면 그 끝까지)를 재생해서 이어지는 모습을 확인
  const l0=layer();
  const endIdx=l0?(l0.toEnd?clips.length-1:Math.min(clips.length-1,ei+(l0.span||1)-1)):ei;
  const r=await playRange(ei,endIdx);
  if(r==='cancel')return;
  playing=false;setPlayUI();
  if(r==='done')await selectClip(ei);
}
$('#btnPlay').onclick=()=>togglePlay();

/* 전환 속도 */
(()=>{
  const sel=$('#trSpeed');
  sel.value=String(TR_LEN);
  if(sel.value!==String(TR_LEN)){ // 저장된 값이 목록에 없으면 가장 가까운 항목
    const opts=[...sel.options].map(o=>+o.value);
    sel.value=String(opts.reduce((a,b)=>Math.abs(b-TR_LEN)<Math.abs(a-TR_LEN)?b:a));
  }
  sel.onchange=()=>{
    TR_LEN=parseFloat(sel.value)||0.4;
    try{localStorage.setItem('trlen',String(TR_LEN))}catch(e){}
    if(trKind!=='none')previewTransition();
  };
})();

/* ---------- 내보내기 ---------- */
function expUI(msg,showBar,btns){
  $('#expMsg').innerHTML=msg;$('#expBar').hidden=!showBar;
  const b=$('#expBtns');b.innerHTML='';
  btns.forEach(([t,fn,pri])=>{const x=document.createElement('button');x.textContent=t;if(pri)x.className='pri';x.onclick=fn;b.appendChild(x)});
}
$('#btnExport').onclick=async()=>{
  if(!clips.length){toast('클립을 먼저 추가하세요');return}
  if(!window.MediaRecorder||!cv.captureStream){toast('이 브라우저는 내보내기를 지원하지 않아요');return}
  if(playing)stopPlay();
  initAudio();
  exporting=true;setPlayUI();$('#exp').hidden=false;$('#expRes').hidden=true;$('#expRes').innerHTML='';
  expUI('방울방울 영상을 만드는 중이에요… 🫧<br><small>끝날 때까지 화면을 켜 두고 이 앱을 보고 있어 주세요.<br>(재생 시간만큼 걸려요)</small>',true,[['취소',()=>{runToken++;vid.pause()}]]);
  let wake=null;try{wake=await navigator.wakeLock.request('screen')}catch(e){}
  const q=parseFloat($('#qSel').value)||1;
  setRes(q);redraw();
  const stream=cv.captureStream(30);
  if(dest)dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  if(prevGain)prevGain.gain.value=0;
  const mime=pickMime(),chunks=[];
  let mr;
  const bps=q>1?14e6:8e6;
  try{mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:bps}:{videoBitsPerSecond:bps})}catch(e){mr=new MediaRecorder(stream)}
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.start(250);
  const ok=(await playRange(0))==='done';
  await new Promise(r=>{mr.onstop=r;mr.stop()});
  if(wake)try{wake.release()}catch(e){}
  exporting=false;setPlayUI();applyVol();
  setRes(PREVIEW_S);redraw();
  if(!ok){$('#exp').hidden=true;toast('내보내기를 취소했어요');await selectClip(0);return}
  const type=mr.mimeType||mime||'video/webm',ext=type.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob);
  const file=new File([blob],'bangul-'+Date.now()+'.'+ext,{type});
  expUI('추억 완성! 🫧🎉',false,[
    ['💾 저장',()=>{const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove()},true],
    ['📤 공유',async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else toast('저장 버튼을 써 주세요')}catch(e){}}],
    ['닫기',()=>{$('#exp').hidden=true;URL.revokeObjectURL(url);selectClip(0)}]
  ]);
  const r=$('#expRes');r.hidden=false;r.innerHTML=`<video src="${url}" controls playsinline></video>`;
};

/* ---------- 재생 진단 ----------
   앱 이름을 빠르게 5번 누르면 열림. 재생이 끊길 때 이 화면을 캡처해서 보내 주면 원인을 정확히 알 수 있음 */
function diagText(){
  const v=clips.filter(c=>c.kind!=='image').length,p=clips.length-v;
  const L=[];
  L.push(`기기: ${isIOS?'아이폰/아이패드':'그 외'} / ${/Safari/.test(navigator.userAgent)&&!/Chrome|CriOS/.test(navigator.userAgent)?'Safari':(/CriOS|Chrome/.test(navigator.userAgent)?'Chrome':'기타')}`);
  L.push(`영상 요소: ${useSingle?'하나만 사용(안전 모드)':'두 개 사용(겹쳐 재생)'}${useSingle&&diagInfo.single?' — 이유: '+diagInfo.single:''}`);
  L.push(`전환: ${TRANS.find(x=>x[0]===trKind)[1]} / 겹침 ${overlapLen()}초`);
  L.push(`클립: 영상 ${v}개, 사진 ${p}개 (길이 ${clips.map(c=>(+c.dur||0).toFixed(1)).join(', ')}초)`);
  L.push(`소리 준비: ${clips.filter(c=>c.kind!=='image').map(c=>hasBuf(c)?(c.pcm?'성공(녹음)':'성공(해독)'):(abuf.get(c.id)==='pending'?'진행중':(isIOS?'실패→보조 오디오':'실패→영상 소리 사용'))).join(', ')||'-'}`);
  L.push(`영상 시작 지연(ms): ${lagSamples.map(Math.round).join(', ')||'아직 측정 전'} → 미리 출발 ${Math.round(leadSec()*1000)}ms 전`);
  L.push(`미리보기 화질: ${Math.round(W*S)}x${Math.round(H*S)}`);
  L.push('');
  L.push('가장 최근 재생(클립별):');
  if(!diag.transitions.length)L.push('  아직 재생 기록이 없어요. 재생한 뒤 다시 열어 주세요.');
  diag.transitions.forEach(x=>L.push(`  클립 ${x.clip}: ${x.방식}${x.넘어가는데ms>=0?`, 앞 클립이 끝난 뒤 움직이기까지 ${x.넘어가는데ms}ms`:''}, 두 영상이 함께 멈춘 최장 ${x.최장멈춤ms}ms`));
  return L.join('\n');
}
(()=>{
  let n=0,t0=0;
  $('header h1').addEventListener('click',()=>{
    const now=performance.now();n=(now-t0<1500)?n+1:1;t0=now;
    if(n>=5){n=0;$('#diagTxt').textContent=diagText();$('#diag').hidden=false}
  });
  $('#diagClose').onclick=()=>{$('#diag').hidden=true};
  $('#diagCopy').onclick=async()=>{
    try{await navigator.clipboard.writeText($('#diagTxt').textContent);toast('복사했어요')}catch(e){toast('복사하지 못했어요. 화면을 캡처해 주세요')}
  };
})();

/* ---------- 배경 방울 ---------- */
(()=>{const b=$('#bubbles');for(let i=0;i<16;i++){const e=document.createElement('i'),z=14+Math.random()*46;
e.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*16}s`;b.appendChild(e)}})();

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- 시작 ---------- */
buildChips();
(async()=>{
  await loadAll();renderList();
  if(clips.length)await selectClip(0);else drawFrame(null,0);
  // 재생 버튼을 누르기 전에 소리 해독과 글꼴 불러오기를 미리 해 둠
